name: ShellCheck

on:
  push:
    paths:
      - "ipregion.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "ipregion.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: bash -n ipregion.sh

      # Errors and warnings fail the build; style notes (info) do not
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=warning ipregion.sh
